<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ห้ามโหลดทรัพยากรจากภายนอกทั้งหมด (Offline 100%) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>BillDesk — ออกเอกสารการค้า</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1f2a44">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/document.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar no-print">
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <div>
        <strong>BillDesk</strong>
        <small>ออฟไลน์ · ข้อมูลอยู่ในเครื่อง</small>
      </div>
    </div>
    <nav>
      <button class="nav-btn" data-nav="list">📋 เอกสารทั้งหมด</button>
      <div class="nav-label">สร้างเอกสารใหม่</div>
      <button class="nav-btn" data-new="QT">＋ ใบเสนอราคา</button>
      <button class="nav-btn" data-new="DO">＋ ใบส่งของ</button>
      <button class="nav-btn" data-new="RC">＋ ใบเสร็จรับเงิน</button>
      <div class="nav-label">ข้อมูลหลัก</div>
      <button class="nav-btn" data-nav="customers">👥 ลูกค้า</button>
      <button class="nav-btn" data-nav="products">📦 สินค้า / บริการ</button>
      <div class="nav-label">ระบบ</div>
      <button class="nav-btn" data-nav="settings">⚙️ ข้อมูลบริษัท &amp; ตั้งค่า</button>
      <button class="nav-btn" data-nav="backup">💾 สำรอง / กู้คืนข้อมูล</button>
    </nav>
    <div class="sidebar-foot" id="backupHint"></div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <section id="view-list" class="view"></section>
    <section id="view-editor" class="view"></section>
    <section id="view-preview" class="view"></section>
    <section id="view-customers" class="view"></section>
    <section id="view-products" class="view"></section>
    <section id="view-settings" class="view"></section>
    <section id="view-backup" class="view"></section>
  </main>
</div>

<div id="toast" class="toast no-print"></div>
<div id="modal" class="modal no-print" hidden>
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/render-doc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
